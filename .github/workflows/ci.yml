name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release job can run the full suite against its own release
  # branch: a pull request opened with GITHUB_TOKEN does not raise events, so
  # it would otherwise get no checks at all.
  workflow_call:
    inputs:
      ref:
        description: The ref to check out. Defaults to the triggering ref.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # github.workflow differs when this workflow is called by another one, which
  # keeps a called run from cancelling the push-triggered run on the same ref.
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Generated types match spec/openapi.json
        run: bun run generate:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: publint and arethetypeswrong
        run: bun run check:package

  dist-node:
    name: Built bundles on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Load the built ESM and CJS bundles on this Node
        run: bun run test:dist

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Load the built ESM bundle
        run: bun test/dist/smoke.mjs

  dist-deno:
    name: Built bundle on Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Load the built ESM bundle
        run: deno run --no-prompt test/dist/smoke.mjs

  models:
    name: Models match the published API document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # A model that demands a field the document does not promise fails on a
      # real answer: that is how reading a credit balance broke in two clients
      # for eleven days (checkslip/billing h-mwp349h7fd1). The document the
      # site serves is the one customers' calls are answered by, so that is
      # what this reads; if it cannot be fetched the script says so and passes.
      # Fetched once, with retries: three separate fetches meant three chances
      # to be reset, and one reset turned this job red on main, which held go
      # 0.9.1 back from the module proxy.
      - name: Fetch the document the site serves
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --user-agent checkslip-sdk-model-check \
            --output openapi-published.json https://checkslip.com/openapi.json
      - name: Compare the models with the document
        run: python3 scripts/check-models.py --repo . --document openapi-published.json
      # The control: drop a field the document promises and the check above has
      # to go red. A checker that cannot fail is not a checker.
      - name: Prove the check can fail
        run: python3 scripts/check-models.py --repo . --document openapi-published.json --prove
      # The fixtures are the other half: a body we test that the API cannot
      # send is a test of a shape nobody receives, and a body missing a field
      # the API always sends is a field no test has ever seen.
      - name: Compare the fixtures with the document
        run: python3 scripts/check-models.py --repo . --document openapi-published.json --fixtures
