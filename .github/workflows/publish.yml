name: Publish

# Called by release-please.yml, never run on its own. Two reasons: the OIDC
# token's workflow_ref claim names the workflow that STARTED the run, so a
# registry trusting release-please.yml rejects a token minted by a direct run
# of this file; and id-token: write has to come from the caller.
#
# A release created with GITHUB_TOKEN does not trigger `on: release`, which is
# GitHub's guard against workflows setting each other off. So the release job
# calls this one directly rather than relying on the event.
#
# Publishing is deliberately dull: prove CI passed on this exact commit, skip a
# version the registry already has, then publish without a token and attach the
# tarball.

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to publish, for example v0.1.0.
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # attach the tarball to the release
      id-token: write # OIDC trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # Ask the other workflows by file name. Counting every check run on
          # the commit would include this job, which waits for itself forever.
          for attempt in $(seq 1 40); do
            pending=0
            failed=0
            for wf in ci.yml commits.yml; do
              state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${sha}&per_page=1" \
                --jq '.workflow_runs[0] | if . == null then "missing" elif .status != "completed" then "running" else .conclusion end')"
              case "$state" in
                success) ;;
                missing|running) pending=1 ;;
                *) echo "::error::${wf} on ${sha} concluded ${state}"; failed=1 ;;
              esac
            done
            if [ "$failed" = 1 ]; then exit 1; fi
            if [ "$pending" = 0 ]; then echo "ci.yml and commits.yml passed for ${sha}"; exit 0; fi
            echo "waiting for the checks on ${sha} (${attempt}/40)"
            sleep 20
          done
          echo "::error::the checks did not finish in time for ${sha}"
          exit 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # Node and npm are here only to run `npm publish`: bun cannot do OIDC
      # trusted publishing yet. Nothing is installed from an npm lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@^11.5.1

      - run: bun install --frozen-lockfile

      - name: Tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(bun --print "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json ${version}"
            exit 1
          fi

      # Publishing twice is not an error worth failing a release over: 0.1.0
      # went out by hand, and a re-run of this job should be harmless.
      - name: Is this version already on npm?
        id: published
        run: |
          version="$(bun --print "require('./package.json').version")"
          if npm view "@checkslip/sdk@${version}" version >/dev/null 2>&1; then
            echo "::notice::@checkslip/sdk@${version} is already on npm; skipping the publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: bun run generate:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:dist
      - run: bun run check:package

      # Trusted publishing is easy to get wrong in ways that produce a
      # confusing error, so say out loud what the publish is about to use.
      # Nothing secret is printed: only whether a variable is set.
      - name: What will npm authenticate with?
        run: |
          npm --version
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NODE_AUTH_TOKEN is set, which overrides OIDC. Trusted publishing wants it unset."
          else
            echo "NODE_AUTH_TOKEN is not set, so npm will use the OIDC token."
          fi
          if [ -f .npmrc ]; then
            echo "repository .npmrc:"; sed -E 's/(_authToken=).*/\1<redacted>/' .npmrc
          fi
          if [ -f "$HOME/.npmrc" ]; then
            echo "runner .npmrc:"; sed -E 's/(_authToken=).*/\1<redacted>/' "$HOME/.npmrc"
          fi

      # No token of ours: npm exchanges the GitHub OIDC token for publish
      # rights and attaches provenance by itself. A 403 here almost always
      # means the workflow filename or environment in the npm trusted publisher
      # settings does not match this run; see RELEASING.md.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public

      - name: Attach the published tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tarball="$(npm pack --silent)"
          gh release upload "${TAG}" "$tarball" --clobber
