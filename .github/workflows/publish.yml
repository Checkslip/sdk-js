name: Publish

# Called by release-please.yml once it has cut a release, and usable on its own
# if a release is ever published by hand.
#
# A release created with GITHUB_TOKEN does not trigger `on: release`, which is
# GitHub's guard against workflows setting each other off. So the release job
# calls this one directly rather than relying on the event.
#
# Publishing is deliberately dull: prove CI passed on this exact commit, skip a
# version the registry already has, then publish without a token and attach the
# tarball.

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to publish, for example v0.1.0.
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # attach the tarball to the release
      id-token: write # OIDC trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 40); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '[.check_runs[] | select(.name != "Publish to npm")] | if length == 0 then "pending" elif any(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") then "failed" elif all(.status == "completed") then "passed" else "pending" end')"
            case "$state" in
              passed) echo "checks passed for $sha"; exit 0 ;;
              failed) echo "::error::checks failed for $sha; not publishing"; exit 1 ;;
              *) echo "waiting for checks on $sha ($attempt/40)"; sleep 30 ;;
            esac
          done
          echo "::error::checks did not finish in time for $sha"
          exit 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # Node and npm are here only to run `npm publish`: bun cannot do OIDC
      # trusted publishing yet. Nothing is installed from an npm lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@^11.5.1

      - run: bun install --frozen-lockfile

      - name: Tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(bun --print "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json ${version}"
            exit 1
          fi

      # Publishing twice is not an error worth failing a release over: 0.1.0
      # went out by hand, and a re-run of this job should be harmless.
      - name: Is this version already on npm?
        id: published
        run: |
          version="$(bun --print "require('./package.json').version")"
          if npm view "@checkslip/sdk@${version}" version >/dev/null 2>&1; then
            echo "::notice::@checkslip/sdk@${version} is already on npm; skipping the publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: bun run generate:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:dist
      - run: bun run check:package

      # No token: npm exchanges the GitHub OIDC token for publish rights, and
      # generates provenance by itself. NODE_AUTH_TOKEN must stay unset — a
      # stale one makes this fail with a misleading "token expired" error.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public

      - name: Attach the published tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tarball="$(npm pack --silent)"
          gh release upload "${TAG}" "$tarball" --clobber
