name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; also signs provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # Node and npm are here only to run `npm publish`: bun cannot do OIDC
      # trusted publishing yet. Nothing is installed from an npm lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer. Node 22 ships npm 10.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          version="$(bun --print "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: bun run generate:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:dist
      - run: bun run check:package
      # No token: npm exchanges the GitHub OIDC token for publish rights, and
      # generates provenance by itself. NODE_AUTH_TOKEN must stay unset — a
      # stale one makes this fail with a misleading "token expired" error.
      - run: npm publish --access public
