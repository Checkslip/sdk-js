name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; also signs provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer. Node 22 ships npm 10.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm run generate:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npm run check:package
      # No token: npm exchanges the GitHub OIDC token for publish rights, and
      # generates provenance by itself. NODE_AUTH_TOKEN must stay unset — a
      # stale one makes this fail with a misleading "token expired" error.
      - run: npm publish --access public
